# Example nginx server block for checkcheckdoublecheck.com -> the Node app.
# Place in /etc/nginx/sites-available/checkcheckdoublecheck.com and symlink into
# sites-enabled, then `sudo nginx -t && sudo systemctl reload nginx`.
#
# TLS: easiest is `sudo certbot --nginx -d checkcheckdoublecheck.com -d www.checkcheckdoublecheck.com`,
# which fills in the listen 443 / ssl_certificate lines for you.

server {
    listen 80;
    listen [::]:80;
    server_name checkcheckdoublecheck.com www.checkcheckdoublecheck.com;

    # --- after certbot you typically redirect to https here ---
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:8090;   # must match PORT in the service
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# After certbot, the block above is rewritten to listen on 443 with the
# certificate lines added. The proxy_pass / proxy_set_header block stays the same.
