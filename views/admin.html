<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>HomeCare scope check — status</title>
<style>
  :root{--bg:#f6f3ee;--card:#fff;--ink:#1d2522;--muted:#6b716c;--line:#e7e2d9;--accent:#a9762a;--accent-soft:#f3ead9}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.55}
  .wrap{max-width:980px;margin:0 auto;padding:40px 18px 80px}
  .kicker{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 8px}
  h1{font-size:28px;font-weight:600;margin:0 0 8px}
  .lede{font-size:15px;color:var(--muted);margin:0 0 24px}
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  th,td{text-align:left;padding:14px 16px;border-bottom:1px solid var(--line);font-size:14.5px;vertical-align:middle}
  th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:#faf8f3}
  tr:last-child td{border-bottom:none}
  .badge{display:inline-block;padding:5px 11px;border-radius:99px;font-size:12.5px;font-weight:600}
  .badge.notopened{background:#e9eef0;color:#5a6b73}
  .badge.opened{background:#f7eed6;color:#8a6310}
  .badge.submitted{background:#e6f1ea;color:#2c5e3c}
  .btn{display:inline-block;font-size:13px;font-weight:600;text-decoration:none;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;padding:7px 12px;margin:0 4px 0 0}
  .btn.ghost{background:#fff;color:var(--accent)}
  .muted{color:#b3aea3}
  .linkcell{font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--muted);text-decoration:none;word-break:break-all}
  .linkcell:hover{color:var(--accent)}
  footer{margin-top:22px;font-size:12.5px;color:#9a958b}
</style>
</head>
<body>
  <div class="wrap">
    <p class="kicker">HomeCare &middot; intern</p>
    <h1>Scope-check status</h1>
    <p class="lede">Wie heeft de link geopend en wie heeft ingediend. De laatste kolom is de persoonlijke link (klikbaar).</p>
    <table>
      <thead>
        <tr><th>Naam</th><th>Rol</th><th>Status</th><th>Antwoorden</th><th>Persoonlijke link</th></tr>
      </thead>
      <tbody>
        {{ROWS}}
      </tbody>
    </table>
    <footer>Deze pagina is alleen bereikbaar met de admin-link. Deel hem niet.</footer>
  </div>
</body>
</html>
