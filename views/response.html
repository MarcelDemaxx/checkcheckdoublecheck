<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Antwoorden — {{NAME}}</title>
<style>
  :root{--bg:#f6f3ee;--card:#fff;--ink:#1d2522;--muted:#6b716c;--line:#e7e2d9;--accent:#a9762a;--accent-soft:#f3ead9;
    --live:#3b7d4f;--live-bg:#e6f1ea;--partial:#b07d12;--partial-bg:#f7eed6;--notyet:#5a6b73;--notyet-bg:#e9eef0;--nsure:#7a756c;--nsure-bg:#eeece6;--notneeded:#6f6f7a;--notneeded-bg:#ececef}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.55}
  .wrap{max-width:880px;margin:0 auto;padding:36px 18px 100px}
  a.back{font-size:13.5px;color:var(--accent);text-decoration:none}
  .kicker{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:18px 0 6px}
  h1{font-size:26px;font-weight:600;margin:0 0 6px}
  .meta{font-size:14px;color:var(--muted);margin:0 0 4px}
  .tally{font-size:14px;color:var(--ink);margin:10px 0 0;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:inline-block}
  h3{font-size:17px;font-weight:600;margin:26px 0 8px}
  table.answers{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  table.answers th,table.answers td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
  table.answers th{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:#faf8f3}
  table.answers tr:last-child td{border-bottom:none}
  td.q{width:58%}
  td.note{color:var(--muted)}
  .badge{display:inline-block;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
  .badge.st-live{background:var(--live-bg);color:var(--live)}
  .badge.st-partial{background:var(--partial-bg);color:var(--partial)}
  .badge.st-notyet{background:var(--notyet-bg);color:var(--notyet)}
  .badge.st-nsure{background:var(--nsure-bg);color:var(--nsure)}
  .badge.st-notneeded{background:var(--notneeded-bg);color:var(--notneeded)}
  .badge.st-none{background:#f0ede6;color:#a39e93}
  .dlrow{margin:18px 0 0}
  .btn{display:inline-block;font-size:13.5px;font-weight:600;text-decoration:none;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:9px;padding:9px 16px}
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="{{BACK}}">&larr; Terug naar status</a>
    <p class="kicker">Ingevulde scope-check</p>
    <h1>{{NAME}} <span style="font-weight:400;color:#6b716c;font-size:18px">· {{ROLE}}</span></h1>
    <p class="meta">Geopend op {{OPENED}} &middot; ingediend op {{SUBMITTED}}</p>
    <div class="tally">{{TALLY}}</div>

    <div class="dlrow"><a class="btn" href="{{DOWNLOAD}}">Download als bestand (JSON)</a></div>

    {{META}}
    {{AREAS}}
  </div>
</body>
</html>
