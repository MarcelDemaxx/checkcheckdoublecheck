<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>HomeCare scope check — verzonden</title>
<style>
  body{margin:0;background:#f6f3ee;color:#1d2522;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.55}
  .box{max-width:560px;margin:14vh auto 0;padding:0 18px;text-align:center}
  .mark{font-size:40px}
  h1{font-size:26px;font-weight:600;margin:14px 0 8px}
  p{font-size:16px;color:#6b716c;margin:0 0 8px}
  .who{display:inline-block;margin-top:18px;background:#e6f1ea;border:1px solid #3b7d4f;border-radius:12px;padding:12px 18px;color:#2c5e3c;font-weight:600}
  .who small{display:block;font-weight:400;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em}
</style>
</head>
<body>
  <div class="box">
    <div class="mark">&#127881;</div>
    <h1>Bedankt, je antwoorden zijn binnen</h1>
    <p>We hebben je scope-check ontvangen. Je hoeft verder niets te doen.</p>
    <p>Deze link werkt nu niet meer.</p>
    <div class="who">{{NAME}}<small>{{ROLE}}</small></div>
  </div>
</body>
</html>
